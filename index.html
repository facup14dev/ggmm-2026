<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link
      rel="preload"
      as="image"
      href="/images/ggmmLogo.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- =====================================================
         SEO PRINCIPAL
    ====================================================== -->

    <title>
      GGMM | Software de Gestión y Digitalización Municipal
    </title>

    <meta
      name="description"
      content="GGMM es una plataforma integral para la digitalización de gobiernos municipales, con soluciones para administración, recaudación, catastro, finanzas, recursos humanos y atención al ciudadano."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link
      rel="canonical"
      href="https://ggmm.com.ar/"
    />

    <!-- =====================================================
         IDENTIDAD / NAVEGADOR
    ====================================================== -->

    <link
      rel="icon"
      type="image/x-icon"
      href="/images/ggmmLogo.ico"
    />

    <meta
      name="theme-color"
      content="#681027"
    />

    <!-- =====================================================
         OPEN GRAPH
    ====================================================== -->

    <meta
      property="og:locale"
      content="es_AR"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="GGMM"
    />

    <meta
      property="og:title"
      content="GGMM | Software de Gestión y Digitalización Municipal"
    />

    <meta
      property="og:description"
      content="Plataforma integral para digitalizar la gestión municipal, optimizar procesos, mejorar la atención al ciudadano y fortalecer la recaudación."
    />

    <meta
      property="og:url"
      content="https://ggmm.com.ar/"
    />

    <meta
      property="og:image"
      content="https://ggmm.com.ar/images/ggmmLogo.png"
    />

    <meta
      property="og:image:width"
      content="2302"
    />

    <meta
      property="og:image:height"
      content="998"
    />

    <meta
      property="og:image:alt"
      content="GGMM - Gestión Gubernamental Municipal"
    />

    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="GGMM | Software de Gestión y Digitalización Municipal"
    />

    <meta
      name="twitter:description"
      content="Plataforma integral para digitalizar la gestión de gobiernos municipales."
    />

    <meta
      name="twitter:image"
      content="https://ggmm.com.ar/images/ggmmLogo.png"
    />

         DATOS ESTRUCTURADOS
    ====================================================== -->

            "name": "INFT S.A.",

            "email": "info@inft.com.ar",

              "@type": "Brand",
